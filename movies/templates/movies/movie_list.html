<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Cartelera</title>
</head>
<body>
    <h1>Cartelera</h1>
    <ul>
        {% for movie in movies %}
            <li>
                <a href="{% url 'movies:recommendations' movie.id %}">{{ movie.title }} ({{ movie.year }})</a>
                — nota media: {{ movie.average_rating|default:"sin valoraciones" }}
            </li>
        {% empty %}
            <li>No hay películas registradas todavía.</li>
        {% endfor %}
    </ul>
</body>
</html>
